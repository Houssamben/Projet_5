  artifacts:
    when: always
    paths:
      - apikey.env
deploy_pprod:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_PPROD_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "pprod"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env
deploy_prod:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_PROD_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "prod"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env

.deploy:
  before_script:
    - echo "{\"name\":\"${DEPLOY_PROJECT_KEY}\"}" > params.json
    - source apikey.env
  script:
    - |
      # add auth
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      # Create virtual environment
      python -m venv venv
      source venv/bin/activate

      # Install Python dependencies
      pip install -r $SOURCES_LOCATION/requirements.txt

      # Set AUTOMATION_API_KEY based on DEPLOY_ENVIRONMENT
      case "$DEPLOY_ENVIRONMENT" in
        "qual") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_QUAL" ;;
        "int") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_INT" ;;
        "rd") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_RD" ;;
        "pprod") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_PPROD" ;;
        "prod") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_PROD" ;;
        *) echo "Unknown DEPLOY_ENVIRONMENT: $DEPLOY_ENVIRONMENT" >&2; exit 1 ;;
      esac

      # Execute the Python script
      python $SOURCES_LOCATION/package_deploy_project_and_api/use_case_indus_project/deploy_use_case_indus.py $DESIGN_RD_USER_API_KEY $DEPLOYER_API_KEY $INFRA_ID $AUTOMATION_API_KEY $DEPLOY_PROJECT_VERSION

