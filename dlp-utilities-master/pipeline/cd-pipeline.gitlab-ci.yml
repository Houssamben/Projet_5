# #############################################################################
# Includes
# #############################################################################

include:
  # ODM pipeline steps and variables
  - project: 'Production-mutualisee/IPS/IDO/gitlab-cicd/pipelines'
    file: '.gitlab-ci.yml'
  # - project: 'market-place/ap26585/paas/gitlab-cd/snippet'
  #   file: 'snippets.yaml'

# #############################################################################
# Global variables
# #############################################################################

variables:
  DEPLOY_ENVIRONMENT:
    value: ""
    options:
      - ""
      - qual
      - int
      - rd
      - pprod
      - prod
    description: "Choose an environment for the deployment"
  DEPLOY_PROJECT_KEY:
    value: ""
    description: "Enter the Dataiku Project Key to deploy"
  DEPLOY_PROJECT_VERSION:
    value: ""
    description: "Enter the Dataiku Project Version to deploy - Latest if empty"
  API_SERVICE_ID:
    value: ""
    description: "Enter the id of the api service to deploy"
    API_SERVICE_VERSION:
      value: ""
      description: "Enter the version of the api service to deploy - Latest if empty"
  INFRA_RD_ID: "automation_rd"
  INFRA_QUAL_ID: "automation_qual"
  INFRA_INT_ID: "automation_int"
  INFRA_PPROD_ID: "automation_pprod"
  INFRA_PROD_ID: "automation_prod"
  DEPLOYER_HOST: "https://ds-deploy.leasingsolutions.echonet/"
  AUTOMATION_RD_HOST: "https://ds-automa-0r1.leasingsolutions.echonet/"
  AUTOMATION_QUAL_HOST: "https://ds-automa-0u0.leasingsolutions.staging.echonet/"
  AUTOMATION_INT_HOST: "https://ds-automa-0t1.leasingsolutions.dev.echonet/"
  AUTOMATION_PPROD_HOST: "https://ds-automa-0q0.leasingsolutions.echonet/"
  AUTOMATION_PROD_HOST: "https://ds-automa.leasingsolutions.echonet/"

  API_INFRA_RD_ID: "api_s02vl9943067_rd"
  API_INFRA_INT_ID: "api_s02vl9959724_int"
  API_INFRA_QUAL_ID: "api_s02vl9943117_qual"
  API_INFRA_PPROD_ID: "api_s02vl9943071_pprod"
  API_INFRA_PROD_ID: "api_s02vl9943069_prod"

  HPRD_VAULT_ADDR: "https://hvault.staging.echonet"
  HPRD_ECOSYSTEM: "EC002I000858"
  PRD_VAULT_ADDR: "https://hvault.group.echonet"
  PRD_ECOSYSTEM: "EC002I000831"
  VAULT_NAMESPACE_ROOT: "BNPPLG_LEASING/5004"
  VAULT_AUTH_ROLE: "gitlab-ci"

  UTILITIES_URL: "gitlab-dogen.group.echonet/dm/bpls/dlp/dlp_evolution/dlp-utilities.git"

  # Configuration
  PIP_CONFIG_FILE: "gitlab-ci/pip/pip.conf"
  VENV_PATH: "venv"
  PACKAGE_PATH: "package"
  PYTHON_VERSION: "3.12.7-06810899"
  SOURCES_LOCATION: "gitlab-ci"
  TESTS_LOCATION: "lib/python"
  APP_NAME: $CI_PROJECT_NAME

# #############################################################################
# Cached informations for all stages
# #############################################################################

cache:
  key: $CI_PIPELINE_ID
  paths:
    - ${VENV_PATH}
    - ${PACKAGE_PATH}
    - build.env
    - gitlab-ci.yml
  policy: pull-push

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

# #############################################################################
# Stages
# #############################################################################

stages:
  - setup
  - deploy
  - api_deploy

pre-config:
  stage: .pre
  image: $CI_REGISTRY/cloudtools:1.2.3
  variables:
    http_proxy: "${BIZ_PROXY}"
    https_proxy: "${BIZ_PROXY}"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: ci-vault
  script:
    - |
      urlencode() {
      echo "$@" | awk -v ORS="" '{ gsub(/./,"&\n") ; print }' | while read l
      do
        c="`echo "$l" | grep '[^-._~0-9a-zA-Z]'`"
        if [ "$l" == "" ]
        then
          echo -n "%20"
        else
          if [ -z "$c" ]
          then
            echo -n "$l"
          else
            printf %%%02X \'"$c"
          fi
        fi
      done
      echo ""
      }

      GITLAB_PASSWORD=$(urlencode ${GITLAB_PASSWORD})

      echo "retrieving dataiku-utilities from gitlab"
      git config --global http.sslverify false
      git config --global init.defaultBranch master
      git config --global advice.detachedHead false
      git clone -b master "https://${GITLAB_USER}:${GITLAB_PASSWORD}@${UTILITIES_URL}" ${SOURCES_LOCATION} --depth 1
      ls -lrt ${SOURCES_LOCATION}


    - export VAULT_NAMESPACE_ROOT="$VAULT_NAMESPACE_ROOT"
    - export DESIGN_KEY_PATH="secret/data/ap59641/rd/toolchain/design"
    - export DEPLOY_KEY_PATH="secret/data/ap59641/rd/toolchain/deploy"
    - export AUTOMATION_KEY_PATH_RD=secret/data/ap59641/rd/toolchain/automation
    - export AUTOMATION_KEY_PATH_INT=secret/data/ap59641/int/toolchain/automation
    - export AUTOMATION_KEY_PATH_QUAL=secret/data/ap59641/qual/toolchain/automation
    - export AUTOMATION_KEY_PATH_PRD=secret/data/ap59641/prod/toolchain/automation
    - export AUTOMATION_KEY_PATH_PPRD=secret/data/ap59641/pprod/toolchain/automation

    - echo "retrieving tokens from vault PRD"
    - export ECOSYSTEM=$(echo "$PRD_ECOSYSTEM" | tr '[:lower:]' '[:upper:]')
    - export VAULT_ADDR="$PRD_VAULT_ADDR"
    - echo "ECOSYSTEM = ${ECOSYSTEM}"
    - echo "VAULT_ADDR = ${VAULT_ADDR}"

    - |
      login_response=$(
        curl -X PUT \
        -H "X-Vault-Request: true" \
        -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" \
        -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
        ${VAULT_ADDR}/v1/auth/jwt/login
         )

    - export VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')
    - vault_design_rd_user_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${DESIGN_KEY_PATH}" | jq -r '.data.data.papikey')
    - vault_deploy_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${DEPLOY_KEY_PATH}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_rd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_RD}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_pprd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_PPRD}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_prd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_PRD}" | jq -r '.data.data.gapikey')

    - echo -e "DESIGN_RD_USER_API_KEY=${vault_design_rd_user_api_key}" > apikey.env
    - echo -e "DEPLOYER_API_KEY=${vault_deploy_api_key}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_RD=${vault_automation_api_key_rd}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_PPRD=${vault_automation_api_key_pprd}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_PRD=${vault_automation_api_key_prd}" >> apikey.env

    - echo "retrieving tokens from vault HPRD"

    - export ECOSYSTEM=$(echo "$HPRD_ECOSYSTEM" | tr '[:lower:]' '[:upper:]')
    - export VAULT_ADDR="$HPRD_VAULT_ADDR"

    - echo "ECOSYSTEM = ${ECOSYSTEM}"
    - echo "VAULT_ADDR = ${VAULT_ADDR}"
    - |
      login_response=$(
        curl -X PUT \
        -H "X-Vault-Request: true" \
        -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" \
        -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
        ${VAULT_ADDR}/v1/auth/jwt/login
         )

    - export VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')
    - vault_automation_api_key_qual=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_QUAL}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_int=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_INT}" | jq -r '.data.data.gapikey')

    - echo -e "AUTOMATION_API_KEY_INT=${vault_automation_api_key_int}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_QUAL=${vault_automation_api_key_qual}" >> apikey.env


  tags:
    - ocp_s
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - $SOURCES_LOCATION/
      - apikey.env
    expire_in: 30 mins

# #############################################################################
# STAGE: DEPLOY
# #############################################################################
deploy_rd:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_RD_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "rd"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env
deploy_int:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_INT_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "int"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env
deploy_qual:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_QUAL_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "qual"'
  tags:
