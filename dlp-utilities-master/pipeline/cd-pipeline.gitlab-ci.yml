  script:
    - |
      # add auth
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      # Create virtual environment
      python -m venv venv
      source venv/bin/activate

      # Install Python dependencies
      pip install -r $SOURCES_LOCATION/requirements.txt

      # Execute the Python script
      python $SOURCES_LOCATION/package_deploy_project_and_api/use_case_indus_api/deploy_use_case_indus_api.py $DESIGN_RD_USER_API_KEY $DEPLOYER_API_KEY $API_SERVICE_ID $INFRA_ID $API_SERVICE_VERSION

