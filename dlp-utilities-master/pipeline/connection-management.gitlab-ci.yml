# .pipeline/connection-management.gitlab-ci.yml

# #############################################################################
# Includes
# #############################################################################

include:
  # ODM pipeline steps and variables
  - project: 'Production-mutualisee/IPS/IDO/gitlab-cicd/pipelines'
    file: '.gitlab-ci.yml'

# #############################################################################
# Global variables
# #############################################################################

variables:
  CONNECTION_NAME:
    value: ""
    description: "Nom de la connexion à gérer (ex: s3-dqc-co002i007517)"
  NODE_NAME:
    value: ""
    options:
      - ""
      - "design_rd"
      - "automation_rd"
      - "automation_int"
      - "automation_qual"
      - "automation_pprod"
      - "automation_prod"
    description: "Nœud Dataiku cible"
  UPDATE_FROM_VAULT:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Mettre à jour les informations d'authentification depuis Vault (true/false)"

# #############################################################################
# Cached informations for all stages
# #############################################################################

cache:
  key: $CI_PIPELINE_ID
  paths:
    - ${VENV_PATH}
    - ${PACKAGE_PATH}
    - build.env
    - gitlab-ci.yml
  policy: pull-push

workflow:
  rules:
    - if: '$PIPELINE_TYPE == "connections"'

# #############################################################################
# Stages
# #############################################################################

stages:
  - setup
  - manage

# #############################################################################
# Pre-configuration
# #############################################################################

pre-config:
  stage: setup
  image: $CI_REGISTRY/cloudtools:1.2.3
  variables:
    http_proxy: "${BIZ_PROXY}"
    https_proxy: "${BIZ_PROXY}"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: ci-vault
  script:
    - |
      urlencode() {
      echo "$@" | awk -v ORS="" '{ gsub(/./,"&\n") ; print }' | while read l
      do
        c="`echo "$l" | grep '[^-._~0-9a-zA-Z]'`"
        if [ "$l" == "" ]
        then
          echo -n "%20"
        else
          if [ -z "$c" ]
          then
            echo -n "$l"
          else
            printf %%%02X \'"$c"
          fi
        fi
      done
      echo ""
      }

    - export VAULT_NAMESPACE_ROOT="$VAULT_NAMESPACE_L"
    - export VAULT_ADDR="$VAULT_ADDR_L"

    - echo "retrieving tokens from vault"
    - echo "VAULT_NAMESPACE = ${VAULT_NAMESPACE_ROOT}"
    - echo "VAULT_ADDR = ${VAULT_ADDR}"

    # Connexion à Vault et récupération du token
    - |
      login_response=$(
        curl -X PUT \
        -H "X-Vault-Request: true" \
        -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}" \
        -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
        ${VAULT_ADDR}/v1/auth/jwt/login
         )

    - export VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')

    # Récupération des clés API pour les différents nœuds
    - vault_design_rd_user_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/rd/toolchain/design" | jq -r '.data.data.papikey')
    - vault_deploy_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/rd/toolchain/deploy" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_rd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/rd/toolchain/automation" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_int=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/int/toolchain/automation" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_qual=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/qual/toolchain/automation" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_pprd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/pprod/toolchain/automation" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_prd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/prod/toolchain/automation" | jq -r '.data.data.gapikey')

    # Sauvegarde des clés API
    - echo -e "DESIGN_RD_USER_API_KEY=${vault_design_rd_user_api_key}" > apikey.env
    - echo -e "DEPLOYER_API_KEY=${vault_deploy_api_key}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_RD=${vault_automation_api_key_rd}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_INT=${vault_automation_api_key_int}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_QUAL=${vault_automation_api_key_qual}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_PPRD=${vault_automation_api_key_pprd}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_PRD=${vault_automation_api_key_prd}" >> apikey.env

  tags:
    - ocp_s
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - apikey.env
    expire_in: 30 mins

# #############################################################################
# Connection Management
# #############################################################################

manage-connection:
  stage: manage
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  before_script:
    - source apikey.env
  script:
    - |
      # Configuration de l'authentification pour Artifactory
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # Configuration du débogage pip
      pip3 config --user debug

      # Création de l'environnement virtuel
      python -m venv venv
      source venv/bin/activate

      # Installation des dépendances Python
      pip install -r requirements.txt

      # Construction des arguments pour le script Python
      PYTHON_ARGS="--node-name $NODE_NAME"

      # Sélection de l'API key en fonction du node
      case $NODE_NAME in
        "design_rd")
          NODE_API_KEY=$DESIGN_RD_USER_API_KEY
          ;;
        "automation_rd")
          NODE_API_KEY=$AUTOMATION_API_KEY_RD
          ;;
        "automation_int")
          NODE_API_KEY=$AUTOMATION_API_KEY_INT
          ;;
        "automation_qual")
          NODE_API_KEY=$AUTOMATION_API_KEY_QUAL
          ;;
        "automation_pprd")
          NODE_API_KEY=$AUTOMATION_API_KEY_PPRD
          ;;
        "automation_prod")
          NODE_API_KEY=$AUTOMATION_API_KEY_PRD
          ;;
        *)
          echo "Node non reconnu: $NODE_NAME"
          exit 1
          ;;
      esac

      PYTHON_ARGS="$PYTHON_ARGS --node-api-key $NODE_API_KEY"

      # Ajout des arguments si les variables sont spécifiées
      if [ -n "$CONNECTION_NAME" ]; then
        PYTHON_ARGS="$PYTHON_ARGS --connection-name $CONNECTION_NAME"
      fi

      # Récupération des informations d'authentification depuis Vault si demandé
      if [ "$UPDATE_FROM_VAULT" == "true" ] && [ -n "$CONNECTION_NAME" ]; then
        # Récupération du token Vault
        login_response=$(curl -X PUT \
          -H "X-Vault-Request: true" \
          -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}" \
          -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
          ${VAULT_ADDR}/v1/auth/jwt/login)

        VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')

        # Déterminer le type de connexion pour savoir quelles informations récupérer
        if [[ "$CONNECTION_NAME" == s3-* ]]; then
          # Connexion COS - récupérer access_key et secret_key
          access_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/${CONNECTION_NAME}/access_key" 2>/dev/null | jq -r '.data.data.value // empty')
          secret_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/${CONNECTION_NAME}/secret_key" 2>/dev/null | jq -r '.data.data.value // empty')

          if [ -n "$access_key" ] && [ -n "$secret_key" ]; then
            PYTHON_ARGS="$PYTHON_ARGS --connection-access-key $access_key --connection-secret-key $secret_key"
            echo "Récupération des clés d'accès pour la connexion COS: $CONNECTION_NAME"
          else
            echo "Aucune clé d'accès trouvée pour la connexion COS: $CONNECTION_NAME"
          fi
        else
          # Connexion DB - récupérer user et password
          user=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/${CONNECTION_NAME}/user" 2>/dev/null | jq -r '.data.data.value // empty')
          password=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/${CONNECTION_NAME}/password" 2>/dev/null | jq -r '.data.data.value // empty')

          if [ -n "$user" ] && [ -n "$password" ]; then
            PYTHON_ARGS="$PYTHON_ARGS --connection-user $user --connection-password $password"
            echo "Récupération des identifiants pour la connexion DB: $CONNECTION_NAME"
          else
            echo "Aucun identifiant trouvé pour la connexion DB: $CONNECTION_NAME"
          fi
        fi
      fi

      # Exécution du script de gestion des connexions
      echo "Exécution du script"
      python -m dataiku_resource_management.runnables.connection_management $PYTHON_ARGS
  when: manual
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env