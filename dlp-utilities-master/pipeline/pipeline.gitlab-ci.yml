# #############################################################################
# Includes
# #############################################################################

include:
  # ODM pipeline steps and variables
  - project: 'Production-mutualisee/IPS/IDO/gitlab-cicd/pipelines'
    file: '.gitlab-ci.yml'

# #############################################################################
# Global variables
# #############################################################################

variables:
  DEPLOY_ENVIRONMENT:
    value: ""
    options:
      - ""
      - rd
      - int
      - qual
    description: "if you want to trigger a non-prod deployment, choose an environment"
  DEPLOY_PROJECT_VERSION:
    value: ""
    description: "Enter the Dataiku Project Version to deploy - Latest if empty"
  API_SERVICE_ID:
    value: ""
    description: "Enter the id of the api service to deploy"
  API_SERVICE_VERSION:
    value: ""
    description: "Enter the version of the api service to deploy - Latest if empty"
  
  INFRA_RD_ID: "automation_rd"
  INFRA_INT_ID: "automation_int"
  INFRA_QUAL_ID: "automation_qual"

  API_INFRA_RD_ID: "api_s02vl9943067_rd"
  API_INFRA_INT_ID: "api_s02vl9959724_int"
  API_INFRA_QUAL_ID: "api_s02vl9943117_qual"

  DEPLOYER_HOST: "https://ds-deploy.leasingsolutions.echonet/"
  AUTOMATION_RD_HOST: "https://ds-automa-0r1.leasingsolutions.echonet/"
  AUTOMATION_INT_HOST: "https://ds-automa-0t1.leasingsolutions.dev.echonet/"
  AUTOMATION_QUAL_HOST: "https://ds-automa-0u0.leasingsolutions.staging.echonet/"
  AUTOMATION_PPRD_HOST: "https://ds-automa-0q0.leasingsolutions.echonet/"
  AUTOMATION_PRD_HOST: "https://ds-automa.leasingsolutions.echonet/"


  HPRD_VAULT_ADDR: "https://hvault.staging.echonet"
  HPRD_ECOSYSTEM: "EC002I000858"
  PRD_VAULT_ADDR: "https://hvault.group.echonet"
  PRD_ECOSYSTEM: "EC002I000831"
  VAULT_NAMESPACE_ROOT: "BNPPLG_LEASING/5004"
  VAULT_AUTH_ROLE: "gitlab-ci"


  UTILITIES_URL: "gitlab-dogen.group.echonet/dm/bpls/dlp/dlp_evolution/dlp-utilities.git"

  # Configuration
  PIP_CONFIG_FILE: "gitlab-ci/pip/pip.conf"
  VENV_PATH: "venv"
  PACKAGE_PATH: "package"
  PYTHON_VERSION: "3.12.7-06810899"
  SOURCES_LOCATION: "gitlab-ci"
  TESTS_LOCATION: "lib/python"
  APP_NAME: $CI_PROJECT_NAME

# #############################################################################
# Cached informations for all stages
# #############################################################################

cache:
  key: $CI_PIPELINE_ID
  paths:
    - ${VENV_PATH}
    - ${PACKAGE_PATH}
    - build.env
    - gitlab-ci.yml
  policy: pull-push

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

# #############################################################################
# Stages
# #############################################################################

stages:
  - setup
  - quality
  - bundle
  - deploy
  - api_bundle
  - api_deploy

pre-config:
  stage: .pre
  image: $CI_REGISTRY/cloudtools:1.2.3
  variables:
    http_proxy: "${BIZ_PROXY}"
    https_proxy: "${BIZ_PROXY}"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: ci-vault
  script:
    - |
      echo "=== Start pre-config stage ==="
      echo "Checking required variables..."

      urlencode() {
      echo "$@" | awk -v ORS="" '{ gsub(/./,"&\n") ; print }' | while read l
      do
        c="`echo "$l" | grep '[^-._~0-9a-zA-Z]'`"
        if [ "$l" == "" ]
        then
          echo -n "%20"
        else
          if [ -z "$c" ]
          then
            echo -n "$l"
          else
            printf %%%02X \'"$c"
          fi
        fi
      done
      echo ""
      }

      GITLAB_PASSWORD=$(urlencode ${GITLAB_PASSWORD})

      if [ -z "$GITLAB_USER" ]; then echo "ERROR: GITLAB_USER is empty"; fi
      if [ -z "$GITLAB_PASSWORD" ]; then echo "ERROR: GITLAB_PASSWORD is empty"; fi
      if [ -z "$VAULT_ID_TOKEN" ]; then echo "ERROR: VAULT_ID_TOKEN is empty"; fi
      echo "All required variables are set"

      echo "retrieving dataiku-utilities from gitlab"
      git config --global http.sslverify false
      git config --global init.defaultBranch master
      git config --global advice.detachedHead false
      git clone -b master "https://${GITLAB_USER}:${GITLAB_PASSWORD}@${UTILITIES_URL}" ${SOURCES_LOCATION} --depth 1
      ls -lrt ${SOURCES_LOCATION}


    - export VAULT_NAMESPACE_ROOT="$VAULT_NAMESPACE_ROOT"
    - export DESIGN_KEY_PATH="secret/data/ap59641/rd/toolchain/design"
    - export DEPLOY_KEY_PATH="secret/data/ap59641/rd/toolchain/deploy"
    - export AUTOMATION_KEY_PATH_RD=secret/data/ap59641/rd/toolchain/automation
    - export AUTOMATION_KEY_PATH_INT=secret/data/ap59641/int/toolchain/automation
    - export AUTOMATION_KEY_PATH_QUAL=secret/data/ap59641/qual/toolchain/automation
    - export AUTOMATION_KEY_PATH_PRD=secret/data/ap59641/prod/toolchain/automation
    - export AUTOMATION_KEY_PATH_PPRD=secret/data/ap59641/pprod/toolchain/automation

    - echo "retrieving tokens from vault PRD"
    - export ECOSYSTEM=$(echo "$PRD_ECOSYSTEM" | tr '[:lower:]' '[:upper:]')
    - export VAULT_ADDR="$PRD_VAULT_ADDR"
    - echo "ECOSYSTEM = ${ECOSYSTEM}"
    - echo "VAULT_ADDR = ${VAULT_ADDR}"

    - |
      login_response=$(
        curl -X PUT \
        -H "X-Vault-Request: true" \
        -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" \
        -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
        ${VAULT_ADDR}/v1/auth/jwt/login
         )

    - export VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')
    - echo "retrieving api keys from vault PRD"
    - vault_design_rd_user_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${DESIGN_KEY_PATH}" | jq -r '.data.data.papikey')
    - vault_deploy_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${DEPLOY_KEY_PATH}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_rd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_RD}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_pprd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_PPRD}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_prd=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_PRD}" | jq -r '.data.data.gapikey')

    - echo -e "DESIGN_RD_USER_API_KEY=${vault_design_rd_user_api_key}" > apikey.env
    - echo -e "DEPLOYER_API_KEY=${vault_deploy_api_key}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_RD=${vault_automation_api_key_rd}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_PPRD=${vault_automation_api_key_pprd}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_PRD=${vault_automation_api_key_prd}" >> apikey.env

    - echo "retrieving tokens from vault HPRD"

    - export ECOSYSTEM=$(echo "$HPRD_ECOSYSTEM" | tr '[:lower:]' '[:upper:]')
    - export VAULT_ADDR="$HPRD_VAULT_ADDR"

    - echo "ECOSYSTEM = ${ECOSYSTEM}"
    - echo "VAULT_ADDR = ${VAULT_ADDR}"
    - |
      login_response=$(
        curl -X PUT \
        -H "X-Vault-Request: true" \
        -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" \
        -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
        ${VAULT_ADDR}/v1/auth/jwt/login
         )
    - echo "retrieving api keys from vault HPRD"
    - export VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')
    - vault_automation_api_key_qual=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_QUAL}" | jq -r '.data.data.gapikey')
    - vault_automation_api_key_int=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}/${ECOSYSTEM}" "${AUTOMATION_KEY_PATH_INT}" | jq -r '.data.data.gapikey')

    - echo -e "AUTOMATION_API_KEY_INT=${vault_automation_api_key_int}" >> apikey.env
    - echo -e "AUTOMATION_API_KEY_QUAL=${vault_automation_api_key_qual}" >> apikey.env
    - echo "=== End pre-config stage ==="


  tags:
    - ocp_s
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - $SOURCES_LOCATION/
      - apikey.env
    expire_in: 30 mins


# #############################################################################
# Tests
# #############################################################################
test:
  stage: quality
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  script:
    - |
      echo "=== Starting test stage ==="
      echo "Checking test configuration..."
      if [ ! -d "$TESTS_LOCATION" ]; then echo "ERROR: Test location $TESTS_LOCATION not found"; fi
      if [ ! -d "$ARTIFACTORY_USER" ]; then echo "ERROR: ARTIFACTORY USER not found"; fi
      if [ ! -d "$ARTIFACTORY_PASSWORD" ]; then echo "ERROR: ARTIFACTORY PASSWORD not found"; fi
      echo "Running pytest..."

      # add auth
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      python -m venv venv
      source venv/bin/activate

      pip install -r $SOURCES_LOCATION/requirements-test.txt
      echo "prepapre target folder"
      mkdir target
      python -m pytest --cov-report=xml:target/coverage.xml --cov=. --junit-xml=target/xunit-result-app.xml $TESTS_LOCATION/
      echo "=== End test stage ==="
  tags:
    - ocp_m
  artifacts:
    when: always
    paths:
      - target
    reports:
      dotenv: build.env

# #############################################################################
# STAGE: SCAN
# #############################################################################
sonar_scan:
  stage: quality
  image:
    name: $CI_REGISTRY/sonarscanner:6.2-n20
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

    #SONAR_TESTS: "$TESTS_LOCATION"
    SONAR_EXCLUSIONS: "dist/**"
    SONAR_COVERAGE_KEY: "sonar.python.coverage.reportPaths"

    SONAR_HOST_URL: "$SONAR_URL"
    SONAR_TEST_INCLUSIONS: ""
    SONAR_SOURCE_ENCODING: "UTF-8"
  script:
    - |
      echo "=== Starting quality stage ==="
      echo "#################################################"
      echo "SCAN SONARQUBE"
      echo "#################################################"
      echo "REPORT_TASK_PATH [$REPORT_TASK_PATH]"
      echo "SONAR_COVERAGE_KEY [$SONAR_COVERAGE_KEY]"
      echo "SONAR_COVERAGE_VALUE [$SONAR_COVERAGE_VALUE]"
      echo "#################################################"

      exit_code=0

      # common properties
      echo "sonar.login=$SONAR_USER" >> sonar-project.properties
      echo "sonar.password=$SONAR_PASSWORD" >> sonar-project.properties
      echo "sonar.scm.provider=git" >> sonar-project.properties
      echo "sonar.links.scm=$CI_PROJECT_URL" >> sonar-project.properties

      # for unit tests

      if [ -n "$SONAR_TEST_INCLUSIONS" ]; then
        echo "add sonar.test.inclusions"
        echo "sonar.test.inclusions=$SONAR_TEST_INCLUSIONS" >> sonar-project.properties
      fi

      # it's a merge request
      if [ -n "$CI_MERGE_REQUEST_ID" ]; then
        echo "merge request"
        echo "sonar.pullrequest.key=$CI_MERGE_REQUEST_IID" >> sonar-project.properties
        echo "sonar.pullrequest.branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" >> sonar-project.properties
        echo "sonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" >> sonar-project.properties
      # default
      else
        echo "default scan"
        echo "sonar.branch.name=$CI_COMMIT_BRANCH" >> sonar-project.properties
      fi

      sonar-scanner || exit_code=$?
      if [ ${exit_code} -ne 0 ]; then
        echo "The gate is KO or the scan fail ! Take a look to previous logs"
      fi
      cat $REPORT_TASK_PATH
      echo "=== End quality stage ==="
  tags:
    - ocp_m
  artifacts:
    paths:
      - .scannerwork/*
      - sonar-project.properties
      - target
    reports:
      dotenv: build.env
  needs:
    - test

# #############################################################################
# STAGE: BUNDLE
# #############################################################################
bundle:
  stage: bundle
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  before_script:
    - source apikey.env
  script:
    - |
      echo "=== Starting project bundle stage ==="
      echo "Checking bundle variables..."
      if [ -z "$DESIGN_RD_USER_API_KEY" ]; then echo "ERROR: DESIGN_RD_USER_API_KEY is empty"; fi
      if [ -z "$DEPLOYER_API_KEY" ]; then echo "ERROR: DEPLOYER_API_KEY is empty"; fi
      echo "All required variables are set"
      echo "Executing bundle script..."

      # add auth
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      # Create virtual environment
      python -m venv venv
      source venv/bin/activate

      # Install Python dependencies
      pip install -r $SOURCES_LOCATION/requirements.txt

      # Execute the Python script
      python $SOURCES_LOCATION/dataiku_resource_management/runnables/package_and_publish_use_case_indus.py --design-rd-user-api-key $DESIGN_RD_USER_API_KEY --deployer-api-key $DEPLOYER_API_KEY
      echo "=== End project bundle stage ==="
  when: manual
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.txt
  rules:
    - if: '$DEPLOY_ENVIRONMENT != ""'

# #############################################################################
# STAGE: DEPLOY
# #############################################################################
deploy_rd:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_RD_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "rd"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env
deploy_int:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_INT_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "int"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env
deploy_qual:
  stage: deploy
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  variables:
    INFRA_ID: $INFRA_QUAL_ID
  extends: .deploy
  when: manual
  rules:
    - if: '$DEPLOY_ENVIRONMENT == "qual"'
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env

.deploy:
  before_script:
    - source apikey.env
  script:
    - |
      echo "=== Starting project deploy stage for $DEPLOY_ENVIRONMENT ==="

      # add auth
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      # Create virtual environment
      python -m venv venv
      source venv/bin/activate

      # Install Python dependencies
      pip install -r $SOURCES_LOCATION/requirements.txt

      # Set AUTOMATION_API_KEY based on DEPLOY_ENVIRONMENT
      case "$DEPLOY_ENVIRONMENT" in
        "qual") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_QUAL" ;;
        "int") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_INT" ;;
        "rd") AUTOMATION_API_KEY="$AUTOMATION_API_KEY_RD" ;;
        *) echo "Unknown DEPLOY_ENVIRONMENT: $DEPLOY_ENVIRONMENT" >&2; exit 1 ;;
      esac

      echo "Checking deploy variables..."
      if [ -z "$INFRA_ID" ]; then echo "ERROR: INFRA_ID is empty"; fi
      if [ -z "$AUTOMATION_API_KEY" ]; then echo "ERROR: AUTOMATION_API_KEY is empty"; fi
      if [ -z "$DEPLOYER_API_KEY" ]; then echo "ERROR: DEPLOYER_API_KEY is empty"; fi
      if [ -z "$DESIGN_RD_USER_API_KEY" ]; then echo "ERROR: DESIGN_RD_USER_API_KEY is empty"; fi

      # Execute the Python script
      python $SOURCES_LOCATION/dataiku_resource_management/runnables/deploy_use_case_indus.py --design-rd-user-api-key $DESIGN_RD_USER_API_KEY --deployer-api-key $DEPLOYER_API_KEY --automation-api-key $AUTOMATION_API_KEY --infra-id $INFRA_ID ${DEPLOY_PROJECT_VERSION:+--version $DEPLOY_PROJECT_VERSION}
      echo "=== End project deploy stage for $DEPLOY_ENVIRONMENT ==="

# #############################################################################
# STAGE: API BUNDLE
# #############################################################################
api_bundle:
  stage: api_bundle
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  before_script:
    - source apikey.env
  script:
    - |
      echo "=== Starting API bundle stage ==="
      echo "Checking API bundle variables..."
      if [ -z "$API_SERVICE_ID" ]; then echo "ERROR: API_SERVICE_ID is empty"; fi
      if [ -z "$AUTOMATION_API_KEY_PPRD" ]; then echo "ERROR: AUTOMATION_API_KEY_PPRD is empty"; fi
      if [ -z "$AUTOMATION_API_KEY_PRD" ]; then echo "ERROR: AUTOMATION_API_KEY_PRD is empty"; fi
      if [ -z "$AUTOMATION_API_KEY_RD" ]; then echo "ERROR: AUTOMATION_API_KEY_RD is empty"; fi
      if [ -z "$AUTOMATION_API_KEY_INT" ]; then echo "ERROR: AUTOMATION_API_KEY_INT is empty"; fi
      if [ -z "$AUTOMATION_API_KEY_QUAL" ]; then echo "ERROR: AUTOMATION_API_KEY_QUAL is empty"; fi
      if [ -z "$DEPLOYER_API_KEY" ]; then echo "ERROR: DEPLOYER_API_KEY is empty"; fi
      echo "All required variables are set"
      echo "Executing API bundle script..."

      # add auth
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      # Create virtual environment
      python -m venv venv
      source venv/bin/activate

      # Install Python dependencies
      pip install -r $SOURCES_LOCATION/requirements.txt

      # Execute the Python script
      python $SOURCES_LOCATION/dataiku_resource_management/runnables/package_and_publish_use_case_indus_api.py --design-rd-user-api-key $DESIGN_RD_USER_API_KEY --deployer-api-key $DEPLOYER_API_KEY --api-service-id $API_SERVICE_ID --automation-api-key-qual $AUTOMATION_API_KEY_QUAL --automation-api-key-int $AUTOMATION_API_KEY_INT --automation-api-key-rd $AUTOMATION_API_KEY_RD --automation-api-key-prd $AUTOMATION_API_KEY_PRD --automation-api-key-pprd $AUTOMATION_API_KEY_PPRD
      echo "=== End API bundle stage ==="
  when: manual
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env
  rules:
    - if: '$DEPLOY_ENVIRONMENT != ""'
