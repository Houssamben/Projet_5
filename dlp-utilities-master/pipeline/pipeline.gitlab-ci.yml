.api_deploy:
  before_script:
    - source apikey.env
  script:
    - |
      echo "=== Starting API deploy stage for $DEPLOY_ENVIRONMENT ==="
      if [ -z "$INFRA_ID" ]; then echo "ERROR: INFRA_ID is empty"; fi
      if [ -z "$DESIGN_RD_USER_API_KEY" ]; then echo "ERROR: DESIGN_RD_USER_API_KEY is empty"; fi
      if [ -z "$DEPLOYER_API_KEY" ]; then echo "ERROR: DEPLOYER_API_KEY is empty"; fi
      if [ -z "$API_SERVICE_ID" ]; then echo "ERROR: API_SERVICE_ID is empty"; fi
      if [ -z "$API_SERVICE_VERSION" ]; then echo "INFO : No API SERVICE VERSION specified"; else echo "INFO : API SERVICE VERSION IS: $API_SERVICE_VERSION"; fi

      # add authx
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # debug config
      pip3 config --user debug

      # Create virtual environment
      python -m venv venv
      source venv/bin/activate

      # Install Python dependencies
      pip install -r $SOURCES_LOCATION/requirements.txt

      # Execute the Python script
      python $SOURCES_LOCATION/dataiku_resource_management/runnables/deploy_use_case_indus_api.py --design-rd-user-api-key $DESIGN_RD_USER_API_KEY --deployer-api-key $DEPLOYER_API_KEY --api-service-id $API_SERVICE_ID --infra-id $INFRA_ID ${API_SERVICE_VERSION:+--api-version $API_SERVICE_VERSION}
      echo "=== End API deploy stage for $DEPLOY_ENVIRONMENT ==="
