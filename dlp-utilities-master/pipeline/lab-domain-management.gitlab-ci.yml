# .pipeline/lab-domain-management.gitlab-ci.yml

# #############################################################################
# Includes
# #############################################################################

include:
  # ODM pipeline steps and variables
  - project: 'Production-mutualisee/IPS/IDO/gitlab-cicd/pipelines'
    file: '.gitlab-ci.yml'

# #############################################################################
# Global variables
# #############################################################################

# Variables pour la gestion des domaines Lab
variables:
  # Code du domaine à gérer (ex: RSK, FIN, etc.)
  # Si non spécifié, tous les domaines seront traités
  DOMAIN_CODE:
    value: ""
    description: "Code du domain lab à gérer (ex: FIN)"


# #############################################################################
# Cached informations for all stages
# #############################################################################

cache:
  key: $CI_PIPELINE_ID
  paths:
    - ${VENV_PATH}
    - ${PACKAGE_PATH}
    - build.env
    - gitlab-ci.yml
  policy: pull-push

workflow:
  rules:
    - if: '$PIPELINE_TYPE == "lab_domain"'

# #############################################################################
# Stages
# #############################################################################

stages:
  - setup
  - manage

# #############################################################################
# Pre-configuration
# #############################################################################

pre-config:
  stage: setup
  image: $CI_REGISTRY/cloudtools:1.2.3
  variables:
    http_proxy: "${BIZ_PROXY}"
    https_proxy: "${BIZ_PROXY}"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: ci-vault
  script:
    - |
      urlencode() {
      echo "$@" | awk -v ORS="" '{ gsub(/./,"&\n") ; print }' | while read l
      do
        c="`echo "$l" | grep '[^-._~0-9a-zA-Z]'`"
        if [ "$l" == "" ]
        then
          echo -n "%20"
        else
          if [ -z "$c" ]
          then
            echo -n "$l"
          else
            printf %%%02X \'"$c"
          fi
        fi
      done
      echo ""
      }
    - export VAULT_NAMESPACE_ROOT="$VAULT_NAMESPACE_L"
    - export VAULT_ADDR="$VAULT_ADDR_L"

    - echo "retrieving tokens from vault"
    - echo "VAULT_NAMESPACE = ${VAULT_NAMESPACE_ROOT}"
    - echo "VAULT_ADDR = ${VAULT_ADDR}"

    # Connexion à Vault et récupération du token
    - |
      login_response=$(
        curl -X PUT \
        -H "X-Vault-Request: true" \
        -H "X-Vault-Namespace: ${VAULT_NAMESPACE_ROOT}" \
        -d "{\"jwt\":\"$VAULT_ID_TOKEN\",\"role\":\"$VAULT_AUTH_ROLE\"}" \
        ${VAULT_ADDR}/v1/auth/jwt/login
         )

    - export VAULT_TOKEN=$(printf '%s' "$login_response" | jq -r '.auth.client_token')

    # Récupération de la clé API pour design_rd depuis Vault
    - vault_design_rd_user_api_key=$(vault read -format=json -ns="${VAULT_NAMESPACE_ROOT}" "secret/data/ap59641/rd/toolchain/design" | jq -r '.data.data.papikey')

    # Sauvegarde de la clé API
    - echo -e "DESIGN_RD_USER_API_KEY=${vault_design_rd_user_api_key}" > apikey.env

  tags:
    - ocp_s
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - apikey.env
    expire_in: 30 mins

# #############################################################################
# Lab Domain Management
# #############################################################################

manage-lab-domain:
  stage: manage
  image: $CI_REGISTRY/python:$PYTHON_VERSION
  before_script:
    - source apikey.env
  script:
    - |
      # Configuration de l'authentification pour Artifactory
      cat <<EOT >> ~/.netrc
      machine repo.artifactory-dogen.group.echonet login ${ARTIFACTORY_USER} password ${ARTIFACTORY_PASSWORD}
      EOT

      # Configuration du débogage pip
      pip3 config --user debug

      # Création de l'environnement virtuel
      python -m venv venv
      source venv/bin/activate

      # Installation des dépendances Python
      pip install -r requirements.txt

      # Construction des arguments pour le script Python
      PYTHON_ARGS="--design-rd-user-api-key $DESIGN_RD_USER_API_KEY"
      if [ -n "$DOMAIN_CODE" ]; then
        PYTHON_ARGS="$PYTHON_ARGS --domain-code $DOMAIN_CODE"
      fi

      # Exécution du script de gestion des domaines Lab
      echo "Exécution du script"
      python -m dataiku_resource_management.runnables.use_case_lab_domain_management $PYTHON_ARGS

  when: manual
  tags:
    - ocp_l
  artifacts:
    when: always
    paths:
      - apikey.env