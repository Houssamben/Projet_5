
# two different properties for "pip search" and "pip install" (?!)
# you can stuff both inside [global] or each one under its own sub-section i.e. [search] and [install]
# https://stackoverflow.com/a/45691769/5162372
[global]
index = https://repo.artifactory-dogen.group.echonet/artifactory/api/pypi/pypi/pypi
index-url = https://repo.artifactory-dogen.group.echonet/artifactory/api/pypi/pypi/simple

timeout = 600
retries =   2
cert = /etc/ssl/certs/BNPPRoot.crt

